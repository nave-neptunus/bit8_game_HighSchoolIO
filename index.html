<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Immune Response</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  html, body { margin: 0; background: #14101c; color: #1b1428; font-family: "Press Start 2P", monospace; }
  #wrap { margin: 8px auto; max-width: 100%; }
  #screen { display: block; image-rendering: pixelated; border: 3px solid #1b1428; box-sizing: content-box; background: #000; }
  #box { background: #fdf6e3; border: 3px solid #1b1428; margin-top: 6px; padding: 10px 12px; min-height: 96px; font-size: 12px; line-height: 1.7; }
  #boxText { min-height: 22px; white-space: pre-wrap; cursor: pointer; }
  #boxText.more::after { content: " \25BC"; animation: blink 0.8s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #boxMenu { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
  #boxMenu.one { grid-template-columns: 1fr; }
  #boxMenu button { font: inherit; font-size: 11px; text-align: left; padding: 8px 10px; background: #fff; border: 2px solid #1b1428; cursor: pointer; display: flex; gap: 8px; align-items: center; }
  #boxMenu button .r { margin-left: auto; color: #6a5a7a; }
  #boxMenu button.focus, #boxMenu button:hover:not([disabled]) { background: #ffe9a8; }
  #boxMenu button[disabled] { opacity: 0.4; cursor: default; }
  #boxMenu button.back { background: #eee; }
  #boxMenu button.dead { opacity: 0.5; }
  .tag { font-size: 9px; padding: 2px 4px; border: 1px solid currentColor; }
  .tag.strong { color: #1f8f3a; } .tag.ok { color: #6a5a7a; } .tag.weak { color: #b5303a; } .tag.sup { color: #2a6fb5; }
  #boxHint { margin-top: 6px; font-size: 10px; color: #6a5a7a; min-height: 14px; }
  #pad { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; user-select: none; touch-action: none; }
  .dpad { display: grid; grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(3, 48px); }
  .dpad button, .ab button { font: inherit; font-size: 14px; background: #3a3045; color: #fff; border: 2px solid #1b1428; }
  .ab { display: flex; gap: 14px; }
  .ab button { width: 64px; height: 64px; border-radius: 50%; background: #b5303a; }
  #btnB { background: #6a5a7a; }
  #keys { color: #8a7aa0; font-size: 9px; text-align: center; margin: 8px 0 16px; line-height: 1.8; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="screen"></canvas>
  <div id="box"><div id="boxText"></div><div id="boxMenu"></div><div id="boxHint"></div></div>
  <div id="pad">
    <div class="dpad">
      <span></span><button data-dir="up">&#9650;</button><span></span>
      <button data-dir="left">&#9664;</button><span></span><button data-dir="right">&#9654;</button>
      <span></span><button data-dir="down">&#9660;</button><span></span>
    </div>
    <div class="ab"><button id="btnB">B</button><button id="btnA">A</button></div>
  </div>
  <div id="keys">Arrows/WASD move &middot; Z/Enter = A (talk, confirm) &middot; X/Esc = B (back, team)</div>
</div>
<script src="engine.js"></script>
<script src="sprites.js"></script>
<script src="game.js"></script>
</body>
</html>
