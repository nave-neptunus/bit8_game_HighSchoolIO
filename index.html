<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Immune Response</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  :root { --ink: #1b1428; --paper: #fdf6e3; --paper2: #f3e9cf; --shell: #3a2f52; --shell2: #2a2238; --accent: #2fb6a8; --gold: #f2c94c; --muted: #6a5a7a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: hidden; min-height: 100%; }
  body { background: radial-gradient(ellipse at 50% 0%, #3b2d58 0%, #1a1426 55%, #0f0b17 100%) fixed; color: var(--ink); font-family: "Press Start 2P", monospace; }
  #wrap { margin: 14px auto 10px; max-width: 100%; }
  .shell { background: linear-gradient(180deg, var(--shell) 0%, var(--shell2) 100%); border-radius: 14px 14px 34px 14px; padding: 14px 14px 12px;
    box-shadow: 0 0 0 3px #120d1c, 0 18px 40px rgba(0,0,0,.55), inset 0 2px 0 rgba(255,255,255,.08); }
  .bezel { background: #120d1c; border-radius: 8px; padding: 10px; box-shadow: inset 0 0 0 2px #4a3d66; position: relative; }
  .bezel::before { content: ""; position: absolute; left: 12px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: #e0524f; box-shadow: 0 0 6px #e0524f; }
  #screen { display: block; margin: 0 auto; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; border-radius: 2px; }
  .brand { display: flex; justify-content: space-between; align-items: baseline; color: #b9a9d6; font-size: 9px; letter-spacing: 1px; margin: 9px 4px 0; }
  .brand b { color: var(--accent); font-weight: normal; } .brand i { font-style: normal; color: var(--gold); }
  #box { position: relative; background: var(--paper); margin-top: 10px; padding: 12px 14px 10px; min-height: 104px; font-size: 12px; line-height: 1.75;
    border: 3px solid var(--ink); border-radius: 6px; box-shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 5px #c9b98f, 0 4px 0 #120d1c; }
  #boxText { min-height: 22px; white-space: pre-wrap; cursor: pointer; }
  #boxText.more::after { content: " \25BC"; color: #b5303a; animation: blink 0.8s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #boxMenu { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; margin-top: 6px; max-height: 230px; overflow-y: auto; }
  #boxMenu.one { grid-template-columns: 1fr; }
  #boxMenu button { font: inherit; font-size: 11px; color: var(--ink); text-align: left; padding: 7px 8px 7px 22px; background: transparent; border: 0; border-radius: 4px;
    cursor: pointer; display: flex; gap: 8px; align-items: center; position: relative; }
  #boxMenu button::before { content: "\25B6"; position: absolute; left: 6px; font-size: 9px; color: #b5303a; opacity: 0; }
  #boxMenu button.focus, #boxMenu button:hover:not([disabled]) { background: var(--paper2); }
  #boxMenu button.focus::before { opacity: 1; animation: nudge .6s steps(2) infinite; }
  @keyframes nudge { 50% { transform: translateX(2px); } }
  #boxMenu button .r { margin-left: auto; color: var(--muted); font-size: 10px; text-align: right; }
  #boxMenu button[disabled] { opacity: 0.35; cursor: default; }
  #boxMenu button.back { color: var(--muted); }
  #boxMenu button.dead { opacity: 0.5; }
  #boxMenu button.act { color: #1f8f3a; }
  .tag { font-size: 8px; padding: 2px 4px; border: 1px solid currentColor; border-radius: 3px; }
  .tag.strong { color: #1f8f3a; background: #e3f5e8; } .tag.ok { color: var(--muted); } .tag.weak { color: #b5303a; } .tag.sup { color: #2a6fb5; }
  #boxHint { margin-top: 6px; padding-top: 6px; border-top: 2px dotted #d8ccae; font-size: 10px; color: var(--muted); min-height: 14px; }
  #boxHint:empty { border-top: 0; padding-top: 0; }
  #pad { display: flex; justify-content: space-between; align-items: center; margin: 14px 6px 4px; user-select: none; -webkit-user-select: none; touch-action: none; }
  .dpad { display: grid; grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(3, 46px); filter: drop-shadow(0 3px 0 #0c0913); }
  .dpad button { font: inherit; font-size: 12px; background: #241c33; color: #8a7aa0; border: 0; }
  .dpad .c { background: #241c33; }
  .dpad [data-dir=up] { border-radius: 8px 8px 0 0; } .dpad [data-dir=down] { border-radius: 0 0 8px 8px; }
  .dpad [data-dir=left] { border-radius: 8px 0 0 8px; } .dpad [data-dir=right] { border-radius: 0 8px 8px 0; }
  .dpad button:active { background: #3a2f52; color: #fff; }
  .ab { display: flex; gap: 16px; transform: rotate(-18deg); }
  .ab button { font: inherit; font-size: 14px; width: 62px; height: 62px; border-radius: 50%; border: 0; color: #fff; background: #b5303a; box-shadow: 0 4px 0 #6e1a22; }
  .ab button:active { transform: translateY(3px); box-shadow: 0 1px 0 #6e1a22; }
  #btnB { background: #6a5a7a; box-shadow: 0 4px 0 #3a3045; margin-top: 26px; }
  #keys { color: #8a7aa0; font-size: 9px; text-align: center; margin: 12px 0 18px; line-height: 2; }
  #keys kbd { font: inherit; color: #d6cde6; background: #241c33; border-radius: 3px; padding: 2px 5px; }
  #gesturePanel[hidden] { display: none; }
  #gesturePanel { position: fixed; right: 12px; bottom: 12px; z-index: 30; width: 222px; padding: 8px; color: #fdf6e3; background: #241c33; border: 3px solid #2fb6a8; box-shadow: 0 5px 0 #0f0b17, 0 10px 25px #0008; font: 11px/1.4 monospace; }
  #gesturePanel header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-weight: bold; }
  #gesturePanel button { color: #fdf6e3; background: #6a5a7a; border: 1px solid #d6cde6; padding: 2px 6px; cursor: pointer; font: inherit; }
  #gesturePanel .preview { position: relative; width: 100%; aspect-ratio: 4/3; overflow: hidden; background: #0f0b17; }
  #gestureVideo { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  #gestureGuide { position: absolute; top: 0; bottom: 0; left: 16%; width: 68%; border: 2px solid #2fb6a8; pointer-events: none; }
  #gestureHold { height: 7px; margin: 6px 0; background: #6a5a7a; }
  #gestureHoldFill { display: block; height: 100%; width: 0; background: #2fb6a8; }
  #gestureStatus { min-height: 30px; margin: 4px 0; }
  #gestureMoves { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 6px; font-size: 10px; }
  #gestureMoves span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (max-width: 520px) { #gesturePanel { width: 150px; right: 4px; top: 4px; bottom: auto; padding: 4px; font-size: 9px; } #gestureMoves { font-size: 8px; } }
  @media (hover: hover) and (pointer: fine) { #pad { display: none; } }
  @media not all and (hover: hover) and (pointer: fine) { #keys { display: none; } }
  @media (max-width: 520px) { #wrap { margin-top: 6px; } .shell { padding: 8px; border-radius: 10px 10px 24px 10px; } .bezel { padding: 6px; } .bezel::before { display: none; } #box { font-size: 11px; } }
</style>
</head>
<body>
<div id="wrap">
  <div class="shell">
  <div class="bezel"><canvas id="screen"></canvas></div>
  <div class="brand"><span><b>IMMUNE</b> <i>RESPONSE</i></span><span>VITAL QUEST</span></div>
  <div id="box"><div id="boxText"></div><div id="boxMenu"></div><div id="boxHint"></div></div>
  <div id="pad">
    <div class="dpad">
      <span></span><button data-dir="up">&#9650;</button><span></span>
      <button data-dir="left">&#9664;</button><span class="c"></span><button data-dir="right">&#9654;</button>
      <span></span><button data-dir="down">&#9660;</button><span></span>
    </div>
    <div class="ab"><button id="btnB">B</button><button id="btnA">A</button></div>
  </div>
  </div>
  <div id="keys"><kbd>Arrows</kbd>/<kbd>WASD</kbd> move &nbsp; <kbd>Z</kbd> A: talk, confirm &nbsp; <kbd>X</kbd> B: back, menu</div>
</div>
<aside id="gesturePanel" hidden aria-label="Gesture camera controls">
  <header><span>CAMERA ATTACKS</span><button id="gestureClose" type="button" aria-label="Turn off camera">OFF</button></header>
  <div class="preview"><video id="gestureVideo" autoplay muted playsinline></video><div id="gestureGuide"></div></div>
  <div id="gestureHold"><span id="gestureHoldFill"></span></div>
  <div id="gestureStatus" aria-live="polite">Camera off.</div>
  <div id="gestureMoves"></div>
</aside>
<script src="engine.js?v=5959f011"></script>
<script src="world.js?v=3903bc23"></script>
<script src="audio.js?v=54e1ed94"></script>
<script src="sprites.js?v=1cc4aecd"></script>
<script src="assets/sprites/manifest.js?v=e7e62e33"></script>
<script src="gesture-control.js?v=bff162ef"></script>
<script src="game.js?v=f407a52d"></script>
</body>
</html>
