<!doctype html>
<html lang="en">
<head>

<title>Immune Defender</title>
<style>

  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif; }

  .primary { background:var(--accent); color:var(--bg); border-color:var(--accent); font-weight:750; }
  .shell { max-width:1160px; margin:auto; padding:18px; min-height:100vh; }
  header { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:15px; }

  h3 { font-size:16px; margin:0 0 9px; }

  .side { display:flex; flex-direction:column; gap:12px; }
  .enemies { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin:16px 0; }

  .actions button { text-align:left; min-height:55px; }

  .log { height:255px; overflow:auto; padding-left:21px; margin:0; }

  .center { max-width:620px; margin:55px auto 0; }
  .center button.primary { margin-top:15px; min-width:210px; }
  .hint { border-left:3px solid var(--accent); padding:8px 12px; background:var(--bg); margin-top:18px; }
  .bossShape { width:140px; height:140px; margin:12px auto; display:grid; place-items:center; }

  .legend button { min-height:77px; text-align:center; }
  .legend svg { width:22px; height:22px; vertical-align:middle; margin-right:4px; }
  .overlay { position:fixed; inset:0; background:#071017de; display:grid; place-items:center; padding:18px; z-index:2; }
  .dialog { width:min(650px,100%); max-height:85vh; overflow:auto; }
  .file { border-top:1px solid var(--line); padding:10px 0; }
  .reportGrid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:18px 0; }
  .reportGrid .card { text-align:center; }
  .reportGrid strong { font-size:24px; display:block; color:var(--accent); }
  /* Pixel battle presentation: crisp edges, chunky borders, and a classic command grid. */
  :root { --bg:#101827; --panel:#1b2b3b; --line:#8da9b3; --text:#f3f4db; --muted:#bbcfce; --accent:#87e0a5; --warn:#f4ce77; --danger:#f38a88; }
  body { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .shell { max-width:1200px; padding:12px 18px; }
  header { margin-bottom:9px; }
  h1 { font-size:23px; text-shadow:3px 3px #345467; }
  h2 { font-size:20px; }
  button,.card { border-radius:0; border:2px solid var(--line); box-shadow:4px 4px 0 #07111c; }
  button:hover,button:focus-visible { background:#2c4a56; box-shadow:4px 4px 0 var(--accent); }
  .primary:hover,.primary:focus-visible { color:var(--text); }
  .hud { margin-bottom:9px; }
  .hud .card { padding:6px 11px; }
  .hud .big { font-size:16px; }
  .bar,.fill { border-radius:0; }
  .stage { grid-template-columns:minmax(0,1.65fr) minmax(290px,.85fr); }
  .main { min-height:502px; }
  .battleMain { padding:11px 15px; }
  .arena { position:relative; height:235px; margin:8px 0 11px; overflow:hidden; border:3px solid var(--line); background:repeating-linear-gradient(0deg,#203745 0 22px,#223b49 22px 24px); }
  .arena:before { content:""; position:absolute; left:-7%; bottom:-34%; width:53%; height:57%; border-radius:50%; background:#486b5b; border:4px solid #71907a; }

  .enemies { position:absolute; right:14px; top:12px; display:flex; width:60%; justify-content:flex-end; gap:9px; margin:0; z-index:1; }
  .enemy { min-height:158px; max-width:195px; display:block; text-align:center; background:#152836e8; padding:5px; }
  .enemy.selected { border:3px solid var(--accent); padding:4px; }
  .enemy .glyph { height:69px; margin:auto; }
  .enemy .glyph svg { shape-rendering:crispEdges; image-rendering:pixelated; }
  .enemyinfo { width:100%; }
  .enemyname { font-size:13px; }

  .enemy .chip { margin:1px 0; font-size:9px; white-space:normal; }
  .antigen { display:inline-flex; align-items:center; gap:4px; color:var(--accent); font-size:11px; font-weight:bold; }

  .battleMessage { background:var(--bg); border:2px solid var(--line); padding:7px 10px; min-height:48px; font-size:13px; margin-bottom:8px; }
  .actions { grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; }
  .actions button { position:relative; min-height:48px; padding:5px 7px; text-align:center; font-size:12px; line-height:1.2; }

  .actions svg { height:17px; width:17px; vertical-align:middle; }
  .actions button[data-tip]:hover:after,.actions button[data-tip]:focus-visible:after,.legend button[data-tip]:hover:after,.legend button[data-tip]:focus-visible:after { content:attr(data-tip); position:absolute; z-index:10; left:50%; bottom:calc(100% + 8px); transform:translateX(-50%); width:245px; max-width:70vw; background:#f3f4db; color:#101827; border:3px solid #101827; box-shadow:4px 4px 0 var(--accent); padding:8px; text-align:left; font-size:12px; line-height:1.35; white-space:normal; pointer-events:none; }
  .log { height:250px; font-size:12px; }
  .bossArena { height:245px; display:grid; place-items:center; position:relative; margin:9px 0; background:repeating-linear-gradient(0deg,#203745 0 22px,#223b49 22px 24px); border:3px solid var(--line); }
  .bossArena .heroSprite { left:9%; bottom:9px; }
  .bossArena .bossShape { position:absolute; right:15%; top:26px; margin:0; width:132px; height:132px; filter:drop-shadow(6px 6px #101827); }
  .bossArena .bossShape svg { shape-rendering:crispEdges; }
  .bossArena .bossLabel { position:absolute; right:8px; bottom:8px; padding:5px 8px; background:var(--bg); border:2px solid var(--line); font-size:12px; }
  .legend { grid-template-columns:repeat(4,1fr); }
  .legend button { position:relative; min-height:60px; padding:5px; }
  /* The whole interface sits in tissue; each arena shows the current anatomy. */
  :root { --bg:#34121b; --panel:#522530; --line:#e0aaa3; --text:#fff3e6; --muted:#f1c4bc; --accent:#9ce8af; --warn:#ffd37e; --danger:#ff8390; }
  body { background:#873b48; }
  .bodyBackdrop { position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; background:radial-gradient(ellipse at 50% 40%,#b55d66 0,#823541 55%,#5b212e 100%); }
  .bodyBackdrop svg { width:100%; height:100%; opacity:.29; image-rendering:pixelated; shape-rendering:crispEdges; }
  .shell { position:relative; z-index:1; }
  .card { background:#522530ed; }
  button { background:#6b3039; }
  button:hover,button:focus-visible { background:#88444c; }
  h1 { text-shadow:3px 3px #762c39; }
  .arena,.bossArena { background:#ac5863; }
  .arena:before,.arena:after { display:none; }
  .sceneArt { position:absolute; inset:0; width:100%; height:100%; image-rendering:pixelated; shape-rendering:crispEdges; }
  .enemy { background:#4c2029ec; }
  .heroSprite svg { filter:drop-shadow(5px 5px #3b1720); }
  .battleMessage { background:#3b1720; }
  .bossArena .bossShape { filter:drop-shadow(6px 6px #3b1720); }
  .overlay { background:#2d0d18e8; }
  .actions button[data-tip]:hover:after,.actions button[data-tip]:focus-visible:after,.legend button[data-tip]:hover:after,.legend button[data-tip]:focus-visible:after { background:#fff3e6; color:#34121b; border-color:#34121b; }
  .mapMain { padding:10px 14px; }
  .mapScreen { display:block; width:min(100%,368px); height:auto; aspect-ratio:160/144; image-rendering:pixelated; border:4px solid var(--line); margin:8px auto; background:#30111f; }
  .mapControls { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:9px; }
  .mapControls p { margin:0; max-width:410px; }
  .dpad { display:grid; grid-template-columns:repeat(3,38px); grid-template-rows:repeat(2,35px); gap:3px; flex:none; }
  .dpad button { padding:1px; font-size:19px; line-height:1; }
  .dpad button[data-dir="up"] { grid-column:2; }
  .dpad button[data-dir="left"] { grid-column:1; grid-row:2; }
  .dpad button[data-dir="down"] { grid-column:2; grid-row:2; }
  .dpad button[data-dir="right"] { grid-column:3; grid-row:2; }
  .mapNote { min-height:43px; padding:6px 8px; border:2px solid var(--line); background:#34121b; font-size:12px; }
  @media(max-width:760px) { .stage,.hud { grid-template-columns:1fr; } .center { margin:20px auto; } .legend { grid-template-columns:repeat(2,1fr); } .arena { height:230px; } .enemies { width:66%; } .actions { grid-template-columns:repeat(2,1fr); } }
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";

/* ===== PURE GAME LOGIC — START (safe to eval in Node; no DOM access) ===== */
// Balance knobs: defender HP 70; enemy attack 3; Mucus 4; Macrophage 9 (18 on tagged bacteria);
// Antibody 10 vs free virus/toxin; Killer T 11 vs infected cells; boss needs 4 correct matches,
// and each wrong boss match costs 9 HP. Fight HP values live in FIGHTS below.
const MAX_HP = 70;
const BOSS_MATCHES = 4;
const BOSS_MISS_DAMAGE = 9;
const SHAPES = ["circle","triangle","square","star"];
const ABILITIES = {
  mucus:{name:"Barrier defense",key:"m"},
  macrophage:{name:"Macrophage",key:"a"},
  antibody:{name:"Antibody (B cell)",key:"b"},
  killer:{name:"Killer T cell",key:"t"}
};
// Escalation models barriers first, then innate phagocytes, then adaptive defenses.
function isAbilityAvailable(ability,zone) {
  return ability==="mucus" || (ability==="macrophage"&&zone>=2) || ((ability==="antibody"||ability==="killer")&&zone>=3);
}
// Each entry models where the immune tool can act. Damage and failure reasons are data.
const EFFECTIVENESS = {
  bacterium:{
    mucus:{damage:4,explain:"At a scrape, fluid flow and early clotting limit entry; airways instead use mucus and cilia."}, // Distinct anatomical barriers share broad first-line protection.
    macrophage:{damage:9,explain:"A macrophage engulfs the bacterium by phagocytosis."}, // Phagocytes engulf bacteria.
    antibody:{tag:true,explain:"Tagged — macrophages can now grip it."}, // Antibodies coat bacteria: opsonization.
    killer:{damage:0,reason:"Killer T cells only attack the body's own infected cells, not bacteria."} // Cytotoxic T cells recognize infected host cells.
  },
  toxin:{
    mucus:{damage:0,reason:"Cilia sweep particles at a barrier; this toxin has already entered tissue."}, // Barrier clearance is local.
    macrophage:{damage:0,reason:"A toxin is a molecule, not a cell — there is nothing to engulf."}, // This move cannot phagocytose this dissolved toxin.
    antibody:{damage:10,explain:"An antibody binds and neutralizes the toxin outside cells."}, // Antibodies bind extracellular toxins.
    killer:{damage:0,reason:"Killer T cells destroy infected body cells; this toxin is not one."} // Cytotoxic T cells target cells.
  },
  virus:{
    mucus:{damage:0,reason:"Cilia help at airways; this free virus has passed the barrier."}, // Barrier clearance is local.
    macrophage:{damage:0,reason:"Here, a matching antibody is needed to neutralize this free virus."}, // Simplified specific neutralization encounter.
    antibody:{damage:10,explain:"An antibody binds the free virus before it enters a cell."}, // Antibodies neutralize extracellular virions.
    killer:{damage:0,reason:"The virus hasn't entered a cell yet — there is no infected cell to destroy."} // Cytotoxic T cells need an infected host cell.
  },
  infected:{
    mucus:{damage:0,reason:"Cilia cannot reach a virus hiding inside a body cell."}, // Barrier defenses act at surfaces.
    macrophage:{damage:0,reason:"The virus is hiding inside a living body cell; this encounter calls for a Killer T cell."}, // Simplified infected-cell response.
    antibody:{damage:0,reason:"The virus is hiding inside the cell, where antibodies can't reach."}, // Antibodies act outside cells.
    killer:{damage:11,explain:"A Killer T cell destroys the infected body cell."} // Cytotoxic T cells kill infected host cells.
  }
};
const ENEMY_NAMES = {bacterium:"Bacterium",toxin:"Toxin",virus:"Free virus",infected:"Infected cell"};
const FIGHTS = [
  {zone:1,title:"Inside the scrape",brief:"A bacterium reached exposed dermis through a break in the skin. Fluid flow and a forming fibrin clot begin to limit entry.",enemies:[{type:"bacterium",hp:8}]},
  {zone:1,title:"Debris in the wound",brief:"Two more bacteria are mixed with dirt in the scrape. The damaged barrier responds broadly before a specific immune response develops.",enemies:[{type:"bacterium",hp:8},{type:"bacterium",hp:8}]},
  {zone:2,title:"Into the bloodstream",brief:"A bacterium crossed the barrier. Macrophages are innate immune cells that can engulf microbes.",enemies:[{type:"bacterium",hp:18}]},
  {zone:2,title:"Phagocyte patrol",brief:"Two bacteria remain in the bloodstream. Phagocytes can attack them without recognizing one exact strain.",enemies:[{type:"bacterium",hp:9},{type:"bacterium",hp:9}]},
  {zone:3,title:"Outside the cell",brief:"A free virus and a toxin are moving through tissue. Both are outside cells, where antibodies can bind their targets. Each target displays an antigen shape.",enemies:[{type:"virus",hp:10,shape:"triangle"},{type:"toxin",hp:10,shape:"square"}]},
  {zone:3,title:"A hidden virus",brief:"A virus has entered one of the body's cells. Antibodies circulate outside cells; Killer T cells can remove infected cells.",enemies:[{type:"infected",hp:11}]},
  {zone:3,title:"Two kinds of target",brief:"One bacterium remains outside cells, while a body cell is infected. A matching antibody can tag the bacterium for phagocytes.",enemies:[{type:"bacterium",hp:18,shape:"star"},{type:"infected",hp:11}]}
];
// Ten 16×16 tiles per row, nine rows: every room is exactly 160×144 pixels.
// Solid letters depict anatomy; dots and lowercase letters are spaces a cell can cross.
const ROOMS = [
  {name:"BREAK IN THE SKIN",start:[4,2],door:[5,7],lastFight:1,description:"An open scrape exposes fibrous dermis. Find the dirt patches, then enter the capillary.",map:[
    "EEAAAAAAEE","EEEAAAAEEE","EE...f..EE","EH.......E","E..w....GE",
    "EE.i...i.E","E........E","EEE..O..EE","EEEEEEEEEE"],encounters:[[3,5],[7,5]]},
  {name:"BLOOD VESSEL",start:[1,4],door:[9,4],lastFight:3,description:"Move through plasma between curved endothelial walls. Red blood cells drift past you.",map:[
    "VVVVVVVVVV","VVV....VVV","VV.......V","V........V","V....i...O",
    "V..i.....V","VV.......V","VVV....VVV","VVVVVVVVVV"],encounters:[[5,4],[3,5]]},
  {name:"LYMPH NODE",start:[2,1],door:[9,7],lastFight:6,description:"Follow sinus channels between reticular fibers and lymphocyte crowds. Talk to the two immune cells with Space.",map:[
    "RRRRRRRRRR","RR...R..RR","R....R...R","R.C..R...R","R..i...i.R",
    "R.C..R...R","R....R.i.R","RR.......O","RRRRRRRRRR"],encounters:[[3,4],[7,4],[7,6]],npcs:[{x:3,y:2,name:"DENDRITIC CELL",line:"I carry pieces of invaders to the lymph node so T cells can recognize them."},{x:7,y:2,name:"HELPER T CELL",line:"I help activate B cells and other T cells for a more specific response."}]},
  {name:"LUNG - ALVEOLI",start:[1,7],boss:[8,3],description:"Follow the thin alveolar surface toward the virus in the largest air sac.",map:[
    "LLLLLLLLLL","LL..LL...L","L...LL...L","L.L.....BL","L.L.LLL..L",
    "L...L....L","LL..L.LL.L","L....LL..L","LLLLLLLLLL"],encounters:[]}
];
function isSolidTile(tile) { return "EAVRCLHG".includes(tile); }
const CASE_FILES = [
  {title:"01 · Barriers",text:"Skin normally blocks entry; after a scrape, fluid and a forming fibrin clot help limit further entry. In airways, mucus traps particles and cilia move them away.",concept:"Skin and airway barriers act before specific recognition."},
  {title:"02 · Innate immunity",text:"Macrophages engulf bacteria through phagocytosis. This innate response can begin quickly without an antibody matched to one strain.",concept:"Macrophages engulf bacteria."},
  {title:"03 · Adaptive immunity",text:"Antibodies bind matching targets outside cells and can tag bacteria for phagocytes. Killer T cells destroy body cells carrying a viral infection.",concept:"Antibodies fit specific targets outside cells; Killer T cells remove infected cells."},
  {title:"04 · Viral change",text:"Antibodies bind particular antigen shapes, so a changed virus may escape an earlier match. Flu vaccines are updated as circulating viruses evolve; immunity to one strain may not protect fully against another.",concept:"Viral changes can alter antibody recognition."}
];
// Pure turn resolution: a failed move still advances the turn and living enemies retaliate.
function resolveTurn(enemies,index,ability,antibodyIndex=null) {
  const next=enemies.map(e=>({...e}));
  const target=next[index];
  if (!target || target.hp<=0 || !EFFECTIVENESS[target.type]?.[ability]) return null;
  const rule=EFFECTIVENESS[target.type][ability];
  let effective=false, message="";
  // Antibodies are specific: this simplified encounter represents matching an exposed antigen.
  if (ability==="antibody" && target.type!=="infected" && target.shape && SHAPES[antibodyIndex]!==target.shape) {
    message=`That antibody does not fit the ${target.shape} antigen. Choose the matching shape.`;
  } else if (rule.tag) {
    effective=!target.tagged;
    target.tagged=true;
    message=effective?rule.explain:"Already tagged — choose a different move.";
  } else if (rule.damage) {
    const damage=ability==="macrophage"&&target.tagged?rule.damage*2:rule.damage;
    target.hp=Math.max(0,target.hp-damage);
    if (ability==="macrophage") target.tagged=false;
    effective=true;
    message=`${ABILITIES[ability].name} dealt ${damage} damage. ${rule.explain}`;
  } else message=rule.reason;
  const retaliation=next.reduce((sum,e)=>sum+(e.hp>0?(e.attack||3):0),0);
  return {enemies:next,effective,message,retaliation};
}
// Boss input is one exact shape match; each successful match forces a different shape.
function resolveBossMatch(currentShape,antibodyIndex,matches,nextShapeIndex) {
  const correct=SHAPES[antibodyIndex]===currentShape;
  if (!correct) return {correct:false,shape:currentShape,matches,damage:BOSS_MISS_DAMAGE};
  const won=matches+1>=BOSS_MATCHES;
  const others=SHAPES.filter(s=>s!==currentShape);
  return {correct:true,shape:won?currentShape:others[nextShapeIndex%others.length],matches:matches+1,damage:0,won};
}
/* ===== PURE GAME LOGIC — END ===== */

const app=document.getElementById("app");
const ZONES=["Skin wound","Bloodstream","Lymph node","Lung alveoli"];
let state;
function freshState() { return {mode:"intro",room:0,player:{x:4,y:2},message:"",bannerUntil:0,fight:0,hp:MAX_HP,enemies:[],selected:0,log:[],files:0,effective:0,wasted:0,bossShape:SHAPES[0],matches:0,overlay:false}; }
function restart() { state=freshState(); render(); }
function enterRoom(index) {
  state.room=index; state.player={x:ROOMS[index].start[0],y:ROOMS[index].start[1]};
  state.mode="explore"; state.message=ROOMS[index].description; state.bannerUntil=Date.now()+2000; render();
}
function activeEncounter() {
  const room=ROOMS[state.room]; const first=state.room===0?0:state.room===1?2:4;
  const i=state.fight-first; return room.encounters[i]||null;
}
function movePlayer(dx,dy) {
  if (state.mode!=="explore"||state.overlay) return;
  const room=ROOMS[state.room],x=state.player.x+dx,y=state.player.y+dy;
  if (x<0||x>=10||y<0||y>=9) return;
  const tile=room.map[y][x];
  if (isSolidTile(tile)) {state.message="Tissue blocks the path. Follow the open channel.";render();return;}
  const npc=room.npcs?.find(n=>n.x===x&&n.y===y);
  if (npc) {state.message=`${npc.name}: ${npc.line}`;render();return;}
  state.player={x,y};
  const encounter=activeEncounter();
  if (encounter&&encounter[0]===x&&encounter[1]===y) {state.mode="briefing";render();return;}
  if (tile==="O") {
    if (state.files>=state.room+1) {enterRoom(state.room+1);return;}
    state.message="Clear this room's infection patches before taking the exit.";
  } else if (tile==="B") {
    state.mode="briefing";render();return;
  } else state.message=tile==="i"?"This patch has been cleared. Keep moving.":room.description;
  render();
}
function talkNearby() {
  if (state.mode!=="explore"||state.overlay) return;
  const npc=ROOMS[state.room].npcs?.find(n=>Math.abs(n.x-state.player.x)+Math.abs(n.y-state.player.y)===1);

function renderIntro() { return `<div class="card main"><div class="center"><div class="eyebrow">An 8-bit immune-system RPG</div><h2>Travel through the body. Fight the infection.</h2><p>Start in a fresh scrape, follow a capillary into the blood, visit the lymph node, then reach the lung alveoli. Step onto infection patches to start turn-based battles.</p><div class="hint">Move with arrow keys or WASD. During combat, hover or focus an attack for its effect.</div><button class="primary" data-action="next">Start run ↵</button></div></div>`; }
function renderExplore() {
  const room=ROOMS[state.room],left=state.room===3?"Reach the virus in the largest alveolus.":state.fight<=room.lastFight?"Clear the glowing infection patch.":"Exit through the opening marked by a ring.";
  return `<div class="card main mapMain"><div class="eyebrow">Inside the body · Room ${state.room+1} of 4</div><h2>${room.name}</h2><canvas id="mapCanvas" class="mapScreen" width="160" height="144" aria-label="${room.name} tile map. Use arrow keys or WASD to move."></canvas><div class="mapNote" aria-live="polite">${state.message}</div><div class="mapControls"><p class="small">${left}<br>Move: arrows / WASD / buttons. Space: talk in lymph node.</p><div class="dpad"><button data-dir="up" aria-label="Move up">↑</button><button data-dir="left" aria-label="Move left">←</button><button data-dir="down" aria-label="Move down">↓</button><button data-dir="right" aria-label="Move right">→</button></div></div></div>`;
}
function renderBriefing() {
  const b=state.fight<FIGHTS.length?FIGHTS[state.fight]:null;
  return `<div class="card main"><div class="center"><div class="eyebrow">${b?`Zone ${b.zone} · Fight ${state.fight+1} of ${FIGHTS.length}`:"Zone 4 · Final encounter"}</div><h2>${b?b.title:"The mutating virus"}</h2><p>${b?b.brief:"A virus presents an antigen shape on its surface. A matching antibody can bind it, but changes to that antigen may prevent the old antibody from fitting."}</p><div class="hint">${b?"Health carries between fights. Click a target or use ← →; hover over attacks for details.":"The shape will change after each correct match. Use antibody keys 1–4 or click the legend."}</div><button class="primary" data-action="next">Enter encounter ↵</button></div></div>`;
}
function renderEnemy(e,i) {
  const hp=Math.max(0,e.hp);
  return `<button class="enemy ${i===state.selected?"selected":""} ${hp===0?"dead":""}" data-target="${i}" ${hp===0?"disabled":""} aria-label="Select ${ENEMY_NAMES[e.type]} ${i+1}"><div class="glyph">${enemySvg(e.type)}</div><div class="enemyinfo"><div class="small">TARGET ${i+1}</div><div class="enemyname">${ENEMY_NAMES[e.type]}</div><div>${hp} HP</div><div class="bar"><div class="fill" style="width:${100*hp/(FIGHTS[state.fight].enemies[i].hp)}%;background:var(--warn)"></div></div>${e.shape?`<span class="antigen">${shapeSvg(e.shape,"var(--accent)")} ${e.shape} antigen</span>`:""}${e.tagged?'<span class="chip">TAGGED · Macrophage ×2</span>':""}</div></button>`;
}
function renderBattle() {
  const b=FIGHTS[state.fight];
  const target=state.enemies[state.selected];
  const moves=[...Object.entries(ABILITIES).filter(([id])=>id!=="antibody"&&available(id)).map(([id,a])=>`<button data-ability="${id}" data-tip="${escapeAttr(tooltipFor(id))}"><span class="key">[${a.key.toUpperCase()}]</span>${a.name}</button>`),...(available("antibody")?SHAPES.map((shape,i)=>`<button data-antibody-move="${i}" data-tip="${escapeAttr(tooltipFor("antibody",i))}"><span class="key">[${i+1}] ANTIBODY</span>${shapeSvg(shape,"var(--accent)")} ${shape.toUpperCase()}</button>`):[])];
  return `<div class="card main battleMain"><div class="eyebrow">Zone ${b.zone} · ${ZONES[b.zone-1]}</div><h2>${b.title}</h2><div class="arena">${sceneSvg(b.zone)}<div class="heroSprite">${heroSvg()}</div><div class="enemies">${state.enemies.map(renderEnemy).join("")}</div></div><div class="battleMessage">${state.log.at(-1)}<br><span class="small">Selected: ${ENEMY_NAMES[target.type]}${target.shape?` · ${target.shape} antigen`:""}</span></div><div class="actions">${moves.join("")}</div><p class="small">Click a target or use ← →. Hover or focus an attack to see what it does.</p></div>`;
}
function renderBoss() {
  return `<div class="card main battleMain"><div class="eyebrow">Zone 4 · Mutating virus</div><h2>Match the antigen</h2><div class="bossArena">${sceneSvg(4)}<div class="heroSprite">${heroSvg()}</div><div class="bossShape" role="img" aria-label="Current antigen: ${state.bossShape}">${shapeSvg(state.bossShape,"var(--danger)")}</div><div class="bossLabel">VIRUS · ${state.bossShape.toUpperCase()} · ${state.matches}/${BOSS_MATCHES}</div></div><div class="battleMessage">${state.log.at(-1)}</div><h3>Choose an antibody</h3><div class="legend">${SHAPES.map((s,i)=>`<button data-antibody="${i}" data-tip="${escapeAttr(s===state.bossShape?`${s} antibody: effective. It matches the current antigen. The virus will mutate after this hit.`:`${s} antibody: ineffective. The current antigen is ${state.bossShape}; this mismatch costs ${BOSS_MISS_DAMAGE} HP.`)}" aria-label="Antibody ${i+1}, ${s}">${shapeSvg(s,"var(--accent)")}<br><span class="key">[${i+1}]</span> ${s.toUpperCase()}</button>`).join("")}</div><p class="small">Hover or focus for effectiveness. Four correct matches win.</p></div>`;
}
function renderCase() {
  const file=CASE_FILES[state.files];
  return `<div class="card main"><div class="center"><div class="eyebrow">Case file collected</div><h2>${file.title}</h2><p>${file.text}</p>${state.files===3?'<div class="hint">Real-world takeaway: flu vaccines are updated as circulating flu viruses change, and immunity to one strain does not guarantee protection against another.</div>':""}<button class="primary" data-action="next">${state.files===3?"View run report":"Continue"} ↵</button></div></div>`;
}
function renderReport() {
  const total=state.effective+state.wasted;
  const rate=total?Math.round(100*state.effective/total):0;
  const grade=rate>=90?"A":rate>=75?"B":rate>=60?"C":rate>=45?"D":"F";
  return `<div class="card main"><div class="eyebrow">End-of-run report</div><h2>Body defended</h2><p>Every defense has a place. Your choices helped clear the infection.</p><div class="reportGrid"><div class="card"><strong>${state.effective}</strong><span class="small">effective</span></div><div class="card"><strong>${state.wasted}</strong><span class="small">wasted</span></div><div class="card"><strong>${rate}%</strong><span class="small">accuracy</span></div><div class="card"><strong>${grade}</strong><span class="small">grade</span></div></div><h3>Four case files · concepts learned</h3>${CASE_FILES.map(f=>`<div class="file"><strong>${f.title}</strong><div class="small">${f.concept}</div></div>`).join("")}<button class="primary" data-action="restart">Play again</button></div>`;
}
function renderLost() { return `<div class="card main"><div class="center"><div class="eyebrow">Run ended</div><h2>The infection overwhelmed the defender.</h2><p>Effective moves: ${state.effective}. Wasted moves: ${state.wasted}. Try matching each defense to where its target is.</p><button class="primary" data-action="restart">Restart run ↵</button></div></div>`; }
function renderSide() {
  const showLog=state.mode==="battle"||state.mode==="boss";
  return `<aside class="side"><div class="card"><h3>Case Files <span class="small">${state.files}/4</span></h3><p class="small">Collect a summary after each zone.</p><button data-action="files">Open case files</button></div>${showLog?`<div class="card"><h3>Combat log</h3><ol class="log" aria-live="polite">${state.log.map(x=>`<li>${x}</li>`).join("")}</ol></div>`:`<div class="card"><h3>Controls</h3><p class="small">Map: arrows or WASD · Space: talk · Enter: continue · Battle: ← → target, M/A/T defenses, 1–4 antibodies · Esc: close files</p></div>`}</aside>`;
}
function renderOverlay() {
  if (!state.overlay) return "";
  return `<div class="overlay" role="dialog" aria-modal="true" aria-label="Case files"><div class="card dialog"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><h2>Case Files</h2><button data-action="close">Close Esc</button></div>${state.files?CASE_FILES.slice(0,state.files).map(f=>`<div class="file"><strong>${f.title}</strong><p>${f.text}</p></div>`).join(""):'<p class="small">No case files collected yet.</p>'}</div></div>`;
}
function render() {
  const content={intro:renderIntro,explore:renderExplore,briefing:renderBriefing,battle:renderBattle,boss:renderBoss,case:renderCase,report:renderReport,lost:renderLost}[state.mode]();
  const zone=state.mode==="explore"||state.mode==="intro"?state.room+1:state.mode==="boss"||state.fight>=FIGHTS.length?4:FIGHTS[state.fight].zone;
  app.innerHTML=`<div class="bodyBackdrop">${sceneSvg(zone,true)}</div><div class="shell"><header><div><div class="eyebrow">High School I/O · Healthcare game</div><h1>IMMUNE DEFENDER</h1></div><div class="topactions"><button data-action="files">Case Files</button><button data-action="restart">Restart</button></div></header>${renderHud()}<div class="stage">${content}${renderSide()}</div></div>${renderOverlay()}`;
  const log=app.querySelector(".log"); if (log) log.scrollTop=log.scrollHeight;
  if (state.mode==="explore") drawMap();
}
app.addEventListener("click",e=>{
  if (e.target.id==="mapCanvas"&&state.mode==="explore") {
    const rect=e.target.getBoundingClientRect(),x=Math.floor((e.clientX-rect.left)*160/rect.width/16),y=Math.floor((e.clientY-rect.top)*144/rect.height/16);
    const dx=x-state.player.x,dy=y-state.player.y;if(Math.abs(dx)+Math.abs(dy)===1)movePlayer(dx,dy);return;
  }
  const button=e.target.closest("button"); if (!button) return;
  const a=button.dataset.action;
  if (a==="restart") restart(); else if (a==="files") {state.overlay=true;render();}
  else if (a==="close") {state.overlay=false;render();}
  else if (a==="next") nextStep();
  else if (button.dataset.dir) {const delta={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[button.dataset.dir];movePlayer(...delta);}
  else if (button.dataset.target!==undefined) {state.selected=Number(button.dataset.target);render();}
  else if (button.dataset.ability) useAbility(button.dataset.ability);
  else if (button.dataset.antibodyMove!==undefined) useAbility("antibody",Number(button.dataset.antibodyMove));
  else if (button.dataset.antibody!==undefined) submitAntibody(Number(button.dataset.antibody),"click");
});
document.addEventListener("keydown",e=>{
  if (state.overlay) {if (e.key==="Escape") {state.overlay=false;render();} return;}
  const k=e.key.toLowerCase();
  if (state.mode==="explore") {
    const delta={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[k];
    if (delta) {e.preventDefault();movePlayer(...delta);return;}
    if (k===" ") {e.preventDefault();talkNearby();return;}
  }
  if (state.mode==="boss" && /^[1-4]$/.test(k)) {submitAntibody(Number(k)-1,"key");return;}
  if (state.mode==="battle") {
    if (k==="arrowleft"||k==="arrowright") {const living=state.enemies.map((x,i)=>x.hp>0?i:-1).filter(i=>i>=0);state.selected=living[(living.indexOf(state.selected)+1)%living.length];render();return;}
    if (/^[1-4]$/.test(k) && available("antibody")) {useAbility("antibody",Number(k)-1);return;}
    const id=Object.keys(ABILITIES).find(id=>ABILITIES[id].key===k);if(id){useAbility(id);return;}
  }
  if (k==="enter") {if (["intro","briefing","case"].includes(state.mode)) nextStep();else if(state.mode==="lost")restart();}
});
restart();
setInterval(()=>{if(state?.mode==="explore")drawMap();},100);
</script>
</body>
</html>
